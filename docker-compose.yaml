services:
  bytem-nginx:
    image: liberbyteadmin/bytem:nginx
    container_name: bytem-nginx
    restart: always
    mem_limit: 512m
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "80:80"
      - "443:443"
      - "8448:8448"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./logs/nginx:/var/log/bytem
    networks:
      default:
        aliases:
          - ${DOMAIN_NAME}
          - ${MATRIX_SERVER_NAME}
    depends_on:
      bytem-pwa:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bytem-be:
    image: liberbyteadmin/bytem:be
    container_name: bytem-be
    restart: always
    depends_on:
      bytem-rabbitmq:
        condition: service_healthy
      bytem-solr:
        condition: service_healthy
      bytem-synapse-db:
        condition: service_healthy
      bytem-synapse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://bytem-rabbitmq:5672/bytem
      SOLR_URL: http://${SOLR_USER}:${SOLR_PASSWORD}@bytem-solr:8983
      API_HOST_INTERNAL: http://bytem-be:3000
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  bytem-bot:
    image: liberbyteadmin/bytem:bot
    container_name: bytem-bot
    restart: always
    depends_on:
      bytem-rabbitmq:
        condition: service_healthy
      bytem-solr:
        condition: service_healthy
      bytem-synapse-db:
        condition: service_healthy
      bytem-synapse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://bytem-rabbitmq:5672/bytem
      SOLR_URL: http://${SOLR_USER}:${SOLR_PASSWORD}@bytem-solr:8983
      API_HOST_INTERNAL: http://bytem-be:3000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health | grep -q '\"status\":\"healthy\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  bytem-pwa:
    image: liberbyteadmin/bytem:pwa
    container_name: bytem-pwa
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${API_HOST}
      API_HOST_INTERNAL: http://bytem-be:3000
      NEXT_PUBLIC_DEMAND_PRODUCT_DEID: ${NEXT_PUBLIC_DEMAND_PRODUCT_DEID:-https://cities.app/de/he/water/water-quality}
      PWA_URL: ${API_HOST}/
      PWA_BYTEM_DEMROOM_FRAME_BACKLINK: ${API_HOST}/
      PWA_DEMAND_BYTEM_GUEST: ${API_HOST}/
      PWA_MATRIX_BYTEM_URL: ${MATRIX_SERVER}/
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/offline"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  bytem-solr:
    image: liberbyteadmin/bytem:solr
    container_name: bytem-solr
    restart: always
    env_file:
      - .env
    environment:
      SOLR_LOG_LEVEL: WARN
      SOLR_OPTS: -Dlog4j2.formatMsgNoLookups=true
      SOLR_USER: ${SOLR_USER}
      SOLR_PASSWORD: ${SOLR_PASSWORD}
    volumes:
      - bytem-solr-data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --user \"$${SOLR_USER}:$${SOLR_PASSWORD}\" http://127.0.0.1:8983/solr/admin/info/system >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bytem-synapse:
    image: liberbyteadmin/bytem:synapse
    container_name: bytem-synapse
    restart: always
    mem_limit: 8g
    depends_on:
      bytem-synapse-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: bytem-synapse-db
    ports:
      - "8008:8008"
      - "8009:8009"
    volumes:
      - bytem-synapse-data:/data
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bytem-synapse-db:
    image: docker.io/postgres:14-alpine
    container_name: bytem-synapse-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports:
      - "5432:5432"
    volumes:
      - bytem-synapse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-$${POSTGRES_USER}}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  bytem-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bytem-rabbitmq
    restart: always
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - bytem-rabbitmq-data:/var/lib/rabbitmq/
      - bytem-rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bytem-rabbitmq-data:
    name: bytem-rabbitmq-data
  bytem-rabbitmq-log:
    name: bytem-rabbitmq-log
  bytem-synapse-db-data:
    name: bytem-synapse-db-data
  bytem-synapse-data:
    name: bytem-synapse-data
  bytem-solr-data:
    name: bytem-solr-data
